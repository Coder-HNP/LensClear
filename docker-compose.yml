version: '3.8'

services:
  # Backend API + Scheduler + Socket Bridge
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    image: lensclear-backend:latest
    container_name: lensclear-backend
    restart: unless-stopped
    ports:
      - "5000:5000" # HTTP API
    environment:
      - NODE_ENV=production
      - PORT=5000
      - FRONTEND_URL=http://localhost:80 # Adjust based on client IP
    networks:
      - lensclear-network

  # Frontend Dashboard
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        - VITE_API_URL=/api
        - VITE_SOCKET_URL=/
    image: lensclear-frontend:latest
    container_name: lensclear-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - lensclear-network

networks:
  # Bridge network for internal communication
  lensclear-network:
    driver: bridge
